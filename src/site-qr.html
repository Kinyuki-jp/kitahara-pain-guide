<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #fff; }
  body { width: 1080px; font-family: "Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif; color: #16201C; }
  .sheet { width: 1080px; height: 1440px; background: #F6F8F6; padding: 76px 80px 90px;
    display: flex; flex-direction: column; gap: 40px; align-items: center; justify-content: center; text-align: center; }
  h1 { font-family: "Zen Maru Gothic","Yu Gothic UI",Meiryo,sans-serif; font-size: 68px; font-weight: 700; line-height: 1.45; }
  .qr { width: 520px; height: 520px; background: #fff; border: 6px solid #1F5C55; border-radius: 20px; padding: 20px; }
  .qr img { width: 100%; height: 100%; display: block; }
  .box { background: #E4EFEB; border: 4px solid #1F5C55; border-radius: 18px; padding: 30px 40px;
    font-size: 36px; line-height: 1.7; text-align: left; width: 100%; }
  .box b { font-family: "Zen Maru Gothic","Yu Gothic UI",Meiryo,sans-serif; color: #1F5C55; }
  .note { font-size: 30px; color: #4A5A54; line-height: 1.7; }
</style>
<div class="sheet">
  <h1>ぜんぶ、この1ページに<br>まとめてあります</h1>
  <div class="qr"><img src="qr/site.png" alt=""></div>
  <div class="box">
    <p><b>スマホのカメラを、この四角に向けるだけ</b>です。<br>受診のしかた・電話番号・持ち物・先生の動画が、全部そこにあります。</p>
  </div>
  <p class="note">お気に入りに入れておくと、次からすぐ開けます。</p>
</div>
